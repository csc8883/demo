<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电力巡视任务智能生成3.0</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f6f8fb;
            color: #172033;
        }
        main {
            width: min(680px, calc(100vw - 48px));
            padding: 32px;
            border: 1px solid #d9e2ec;
            background: #fff;
            box-shadow: 0 18px 48px rgba(15, 23, 42, 0.08);
        }
        h1 { margin: 0 0 12px; font-size: 24px; }
        p { margin: 10px 0; line-height: 1.7; color: #4a5870; }
        code {
            padding: 2px 6px;
            border-radius: 4px;
            background: #eef3f8;
            color: #0f766e;
        }
        a { color: #0f766e; font-weight: 700; }
    </style>
</head>
<body>
    <main>
        <h1>前端已迁移到 React/Vite</h1>
        <p>这个根目录 <code>index.html</code> 只保留为提示页，旧 <code>static/js</code> 前端不再作为应用入口。</p>
        <p>生产方式：在 <code>frontend</code> 目录执行 <code>npm run build</code>，然后启动 <code>python main.py</code>，访问 <a href="http://127.0.0.1:8000/">http://127.0.0.1:8000/</a>。</p>
        <p>开发方式：启动 FastAPI 后，再在 <code>frontend</code> 目录执行 <code>npm run dev</code>，访问 Vite 输出的地址。</p>
    </main>
</body>
</html>
